<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Wasm Parser</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 30px;
            background: #0e1118;
            color: #e4e6eb;
        }

        .box {
            max-width: 600px;
            margin: 40px auto;
            background: #1c1f26;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #2d3139;
        }

        input[type="file"] {
            margin: 20px 0;
            display: block;
            color: #a3a7b0;
        }

        #output {
            background: #090b0f;
            color: #4af626;
            padding: 15px;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre-wrap;
            border: 1px solid #1a1d24;
            min-height: 60px;
        }

        .pagination {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 15px;
            font-family: sans-serif;
            font-size: 14px;
            color: #a3a7b0;
        }

        .pagination button {
            background: #2d3139;
            color: #e4e6eb;
            border: 1px solid #3d4149;
            border-radius: 4px;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 13px;
        }

        .pagination button:hover:not(:disabled) {
            background: #3d4149;
        }

        .pagination button:disabled {
            opacity: 0.35;
            cursor: default;
        }

        .pagination .page-info {
            color: #6b7280;
        }

        .search-bar {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .search-bar input {
            flex: 1;
            background: #090b0f;
            color: #e4e6eb;
            border: 1px solid #2d3139;
            border-radius: 4px;
            padding: 8px 12px;
            font-family: monospace;
            font-size: 13px;
            outline: none;
        }

        .search-bar input:focus {
            border-color: #4af626;
        }

        .search-bar input::placeholder {
            color: #4b5563;
        }

        .search-bar button {
            background: #2d3139;
            color: #e4e6eb;
            border: 1px solid #3d4149;
            border-radius: 4px;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 13px;
        }

        .search-bar button:hover {
            background: #3d4149;
        }

        .search-stats {
            margin-top: 8px;
            font-size: 12px;
            color: #6b7280;
            font-family: sans-serif;
        }

        #output mark {
            background: #854d0e;
            color: #fef3c7;
            border-radius: 2px;
            padding: 0 1px;
        }

        .level-filters {
            display: flex;
            gap: 6px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .level-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #1c1f26;
            color: #6b7280;
            border: 1px solid #2d3139;
            border-radius: 4px;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 12px;
            font-family: monospace;
            user-select: none;
            transition: background 0.15s, color 0.15s;
        }

        .level-btn .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4b5563;
        }

        .level-btn.active {
            color: #e4e6eb;
            border-color: #3d4149;
        }

        .level-btn.active[data-level="error"] { color: #f87171; border-color: #7f1d1d; }
        .level-btn.active[data-level="error"] .dot { background: #f87171; }

        .level-btn.active[data-level="warn"] { color: #fbbf24; border-color: #78350f; }
        .level-btn.active[data-level="warn"] .dot { background: #fbbf24; }

        .level-btn.active[data-level="info"] { color: #60a5fa; border-color: #1e3a5f; }
        .level-btn.active[data-level="info"] .dot { background: #60a5fa; }

        .level-btn.active[data-level="debug"] { color: #a78bfa; border-color: #4c1d95; }
        .level-btn.active[data-level="debug"] .dot { background: #a78bfa; }

        .level-btn.active[data-level="none"] { color: #9ca3af; border-color: #374151; }
        .level-btn.active[data-level="none"] .dot { background: #9ca3af; }

        .level-btn .count {
            opacity: 0.6;
            font-size: 11px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>Rust + Wasm Engine Sandbox</h2>
        <p>Upload a log file to test the internal engine processing:</p>

        <input type="file" id="fileInput" />

        <div class="search-bar" id="searchBar" style="display: none;">
            <input type="text" id="searchInput" placeholder="Search lines..." />
            <button id="clearSearch">Clear</button>
        </div>
        <div class="search-stats" id="searchStats"></div>

        <div class="level-filters" id="levelFilters" style="display: none;">
            <button class="level-btn active" data-level="error">ERROR <span class="dot"></span><span class="count" id="countError"></span></button>
            <button class="level-btn active" data-level="warn">WARN <span class="dot"></span><span class="count" id="countWarn"></span></button>
            <button class="level-btn active" data-level="info">INFO <span class="dot"></span><span class="count" id="countInfo"></span></button>
            <button class="level-btn active" data-level="debug">DEBUG <span class="dot"></span><span class="count" id="countDebug"></span></button>
            <button class="level-btn active" data-level="none">OTHER <span class="dot"></span><span class="count" id="countNone"></span></button>
        </div>

        <h3>Engine State:</h3>
        <div id="output">Initializing...</div>

        <div class="pagination" id="pagination" style="display: none;">
            <button id="prevBtn" disabled>Previous</button>
            <span class="page-info" id="pageInfo">Page 1 of 1</span>
            <button id="nextBtn" disabled>Next</button>
        </div>
    </div>

    <script type="module">
        import init, { LogIndexer } from '../pkg/log_parser.js';

        const fileInput = document.getElementById('fileInput');
        const output = document.getElementById('output');
        const pagination = document.getElementById('pagination');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const pageInfo = document.getElementById('pageInfo');
        const searchBar = document.getElementById('searchBar');
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearch');
        const searchStats = document.getElementById('searchStats');
        const levelFilters = document.getElementById('levelFilters');
        const countError = document.getElementById('countError');
        const countWarn = document.getElementById('countWarn');
        const countInfo = document.getElementById('countInfo');
        const countDebug = document.getElementById('countDebug');
        const countNone = document.getElementById('countNone');

        const LEVEL_MAP = { error: 4, warn: 3, info: 2, debug: 1, none: 0 };
        const PAGE_SIZE = 20;
        let indexer = null;
        let totalLines = 0;
        let currentPage = 1;
        let filteredIndices = null;
        let searchQuery = '';
        let activeLevels = new Set(['error', 'warn', 'info', 'debug', 'none']);

        function escapeHtml(text) {
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function highlightMatch(text, query) {
            if (!query) return escapeHtml(text);
            const escaped = escapeHtml(text);
            const re = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
            return escaped.replace(re, (m) => `<mark>${m}</mark>`);
        }

        function rebuildFiltered() {
            if (!indexer) return;
            const hasSearch = searchQuery.length > 0;
            const allLevelsActive = activeLevels.size === 5;

            if (!hasSearch && allLevelsActive) {
                filteredIndices = null;
                return;
            }

            const re = hasSearch ? new RegExp(searchQuery, 'i') : null;
            filteredIndices = [];
            for (let i = 0; i < totalLines; i++) {
                if (!allLevelsActive) {
                    const level = indexer.get_line_level(i);
                    const levelName = ['none', 'debug', 'info', 'warn', 'error'][level];
                    if (!activeLevels.has(levelName)) continue;
                }
                if (re) {
                    const line = indexer.get_line(i);
                    if (!line || !re.test(line)) continue;
                }
                filteredIndices.push(i);
            }
        }

        function renderPage() {
            const indices = filteredIndices || null;
            const count = indices ? indices.length : totalLines;
            const totalPages = Math.max(1, Math.ceil(count / PAGE_SIZE));

            if (currentPage > totalPages) currentPage = totalPages;

            const start = (currentPage - 1) * PAGE_SIZE;
            const end = Math.min(start + PAGE_SIZE, count);
            const lines = [];

            for (let i = start; i < end; i++) {
                const lineIdx = indices ? indices[i] : i;
                const line = indexer.get_line(lineIdx);
                const lineNum = String(lineIdx + 1).padStart(6, ' ');
                const prefix = lineNum + ' | ';
                lines.push(prefix + highlightMatch(line ?? '', searchQuery));
            }

            output.innerHTML = lines.length > 0
                ? lines.join('\n')
                : 'No matching lines.';

            pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
            prevBtn.disabled = currentPage <= 1;
            nextBtn.disabled = currentPage >= totalPages;

            if (searchQuery || activeLevels.size < 5) {
                searchStats.textContent = `${count.toLocaleString()} of ${totalLines.toLocaleString()} lines shown`;
            } else {
                searchStats.textContent = '';
            }
        }

        prevBtn.addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderPage();
            }
        });

        nextBtn.addEventListener('click', () => {
            currentPage++;
            renderPage();
        });

        let searchTimeout = null;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                searchQuery = searchInput.value.trim();
                currentPage = 1;
                rebuildFiltered();
                renderPage();
            }, 200);
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            searchQuery = '';
            filteredIndices = null;
            currentPage = 1;
            searchStats.textContent = '';
            renderPage();
        });

        function updateLevelCounts() {
            if (!indexer) return;
            countError.textContent = indexer.count_by_level(4) || '';
            countWarn.textContent = indexer.count_by_level(3) || '';
            countInfo.textContent = indexer.count_by_level(2) || '';
            countDebug.textContent = indexer.count_by_level(1) || '';
            countNone.textContent = indexer.count_by_level(0) || '';
        }

        document.querySelectorAll('.level-btn').forEach((btn) => {
            btn.addEventListener('click', () => {
                const level = btn.dataset.level;
                if (activeLevels.has(level)) {
                    activeLevels.delete(level);
                    btn.classList.remove('active');
                } else {
                    activeLevels.add(level);
                    btn.classList.add('active');
                }
                currentPage = 1;
                rebuildFiltered();
                renderPage();
            });
        });

        async function start() {
            try {
                await init();
                output.innerText = "Engine loaded. Ready for file streaming.";

                fileInput.addEventListener('change', async (event) => {
                    const file = event.target.files[0];
                    if (!file) return;

                    output.innerText = `Streaming ${file.name}...`;
                    pagination.style.display = 'none';
                    searchBar.style.display = 'none';
                    levelFilters.style.display = 'none';
                    searchStats.textContent = '';

                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        const fileBytes = new Uint8Array(e.target.result);

                        console.time("Processing Time");
                        indexer = new LogIndexer(fileBytes);
                        console.timeEnd("Processing Time");

                        totalLines = indexer.total_lines();
                        const totalErrors = indexer.total_errors();
                        currentPage = 1;
                        filteredIndices = null;
                        searchQuery = '';
                        searchInput.value = '';
                        activeLevels = new Set(['error', 'warn', 'info', 'debug', 'none']);
                        document.querySelectorAll('.level-btn').forEach((b) => b.classList.add('active'));

                        if (totalLines === 0) {
                            output.innerText = 'No lines found in file.';
                            return;
                        }

                        pagination.style.display = 'flex';
                        searchBar.style.display = 'flex';
                        levelFilters.style.display = 'flex';
                        updateLevelCounts();
                        renderPage();

                        console.log(`Loaded: ${totalLines.toLocaleString()} lines, ${totalErrors.toLocaleString()} errors`);
                    };
                    reader.readAsArrayBuffer(file);
                });
            } catch (err) {
                output.innerText = "Error loading Wasm engine: " + err;
                console.error(err);
            }
        }

        start();
    </script>

</body>

</html>
