<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Wasm Parser</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 30px;
            background: #0e1118;
            color: #e4e6eb;
        }

        .box {
            max-width: 600px;
            margin: 40px auto;
            background: #1c1f26;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #2d3139;
        }

        input[type="file"] {
            margin: 20px 0;
            display: block;
            color: #a3a7b0;
        }

        #output {
            background: #090b0f;
            color: #4af626;
            padding: 15px;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre-wrap;
            border: 1px solid #1a1d24;
            min-height: 60px;
        }

        .pagination {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 15px;
            font-family: sans-serif;
            font-size: 14px;
            color: #a3a7b0;
        }

        .pagination button {
            background: #2d3139;
            color: #e4e6eb;
            border: 1px solid #3d4149;
            border-radius: 4px;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 13px;
        }

        .pagination button:hover:not(:disabled) {
            background: #3d4149;
        }

        .pagination button:disabled {
            opacity: 0.35;
            cursor: default;
        }

        .pagination .page-info {
            color: #6b7280;
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>Rust + Wasm Engine Sandbox</h2>
        <p>Upload a log file to test the internal engine processing:</p>

        <input type="file" id="fileInput" />

        <h3>Engine State:</h3>
        <div id="output">Initializing...</div>

        <div class="pagination" id="pagination" style="display: none;">
            <button id="prevBtn" disabled>Previous</button>
            <span class="page-info" id="pageInfo">Page 1 of 1</span>
            <button id="nextBtn" disabled>Next</button>
        </div>
    </div>

    <script type="module">
        import init, { LogIndexer } from '../pkg/log_parser.js';

        const fileInput = document.getElementById('fileInput');
        const output = document.getElementById('output');
        const pagination = document.getElementById('pagination');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const pageInfo = document.getElementById('pageInfo');

        const PAGE_SIZE = 20;
        let indexer = null;
        let totalLines = 0;
        let totalPages = 0;
        let currentPage = 1;

        function renderPage() {
            const start = (currentPage - 1) * PAGE_SIZE;
            const end = Math.min(start + PAGE_SIZE, totalLines);
            const lines = [];

            for (let i = start; i < end; i++) {
                const line = indexer.get_line(i);
                const prefix = String(i + 1).padStart(6, ' ') + ' | ';
                lines.push(prefix + (line ?? ''));
            }

            output.innerText = lines.join('\n');
            pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
            prevBtn.disabled = currentPage <= 1;
            nextBtn.disabled = currentPage >= totalPages;
        }

        prevBtn.addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderPage();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentPage < totalPages) {
                currentPage++;
                renderPage();
            }
        });

        async function start() {
            try {
                await init();
                output.innerText = "Engine loaded. Ready for file streaming.";

                fileInput.addEventListener('change', async (event) => {
                    const file = event.target.files[0];
                    if (!file) return;

                    output.innerText = `Streaming ${file.name}...`;
                    pagination.style.display = 'none';

                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        const fileBytes = new Uint8Array(e.target.result);

                        console.time("Processing Time");
                        indexer = new LogIndexer(fileBytes);
                        console.timeEnd("Processing Time");

                        totalLines = indexer.total_lines();
                        const totalErrors = indexer.total_errors();
                        totalPages = Math.max(1, Math.ceil(totalLines / PAGE_SIZE));
                        currentPage = 1;

                        if (totalLines === 0) {
                            output.innerText = 'No lines found in file.';
                            return;
                        }

                        pagination.style.display = 'flex';
                        renderPage();

                        console.log(`Loaded: ${totalLines.toLocaleString()} lines, ${totalErrors.toLocaleString()} errors, ${totalPages} pages`);
                    };
                    reader.readAsArrayBuffer(file);
                });
            } catch (err) {
                output.innerText = "Error loading Wasm engine: " + err;
                console.error(err);
            }
        }

        start();
    </script>

</body>

</html>
